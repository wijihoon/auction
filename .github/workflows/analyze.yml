name: 경매 자동 수집·분석

on:
  workflow_dispatch: {}
  schedule:
    - cron: "27 21 * * *"     # 매일 06:00 KST (전날 21:00 UTC) 수집·분석
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: auction-pipeline
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 물건 수집 (법원경매정보)
        run: python scripts/crawl.py
        # 라이브 실패 시 크롤러가 스스로 기존 데이터 보존/샘플 폴백(항상 정상 종료)

      - name: 분석 (시세 조회·적정입찰·성공률·순이익·점수)
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: python scripts/analyze.py

      - name: 예측 스냅샷·실제결과 대조·학습파일 갱신
        run: python scripts/track.py

      - name: 블로그 콘텐츠 생성 (종합점수 top10, 사건 중복 제외)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/content.py

      - name: 결과 커밋
        run: |
          git config user.name  "auction-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME:-master}"
          git add -A data content
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 경매 물건 자동 수집·분석 갱신 [skip ci]"
            for i in 1 2 3 4 5; do
              # 원격이 앞서갔을 수 있으니 rebase 후 재시도(생성 파일 충돌 시 이번 실행분 우선)
              git pull --rebase -X theirs --autostash origin "$BRANCH" || true
              if git push origin "HEAD:$BRANCH"; then
                echo "push 성공"; exit 0
              fi
              echo "원격 변경 감지 — 재시도 $i/5..."; sleep 3
            done
            echo "push 실패(재시도 초과)"; exit 1
          fi